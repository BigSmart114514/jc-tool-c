name: Build Windows (MSVC 2022)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (required if create_release is true)'
        type: string
        default: ''

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build on Windows
    # `windows-latest` was migrated from VS 2022 to Visual Studio 2026 (VS 18)
    # in June 2026, which broke this workflow's hardcoded "Visual Studio 17
    # 2022" generator. The Qt kit (win64_msvc2022_64) and the libssh MSVC17
    # package are built for the VS 2022 toolset, so GitHub recommends pinning
    # `windows-2022` when you need to stay on VS 2022.
    runs-on: windows-2022

    steps:
      - name: Checkout current project
        uses: actions/checkout@v4

      - name: Install Qt6 (MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------- EasyTier ----------
      - name: Download EasyTier FFI artifact
        shell: pwsh
        run: |
          $runId = gh run list --workflow easytier.yml --repo ${{ github.repository }} --limit 1 --status success --json databaseId --jq '.[0].databaseId'
          if (-not $runId) { Write-Error "No successful easytier.yml run found"; exit 1 }
          gh run download $runId --repo ${{ github.repository }} --name easytier-ffi-windows-x64 --dir easytier-ffi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download EasyTier runtime DLLs (Packet.dll, wintun.dll)
        shell: pwsh
        run: |
          $url = "https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-windows-x86_64-v2.6.4.zip"
          Invoke-WebRequest -Uri $url -OutFile easytier-release.zip
          Expand-Archive -Path easytier-release.zip -DestinationPath easytier-release
          $innerDir = Get-ChildItem -Directory -Path easytier-release | Select-Object -First 1
          $srcDir = if ($innerDir) { $innerDir.FullName } else { "easytier-release" }
          $targetDir = "${{ github.workspace }}/../easytier/bin"
          New-Item -ItemType Directory -Force -Path $targetDir
          Copy-Item -Path "$srcDir\Packet.dll" -Destination $targetDir -Force
          Copy-Item -Path "$srcDir\wintun.dll" -Destination $targetDir -Force

      - name: Deploy EasyTier FFI
        shell: pwsh
        run: |
          $targetDir = "${{ github.workspace }}/../easytier"
          New-Item -ItemType Directory -Force -Path "$targetDir/include"
          New-Item -ItemType Directory -Force -Path "$targetDir/lib"
          New-Item -ItemType Directory -Force -Path "$targetDir/bin"
          Copy-Item -Path "easytier-ffi\easytier_ffi.dll" "$targetDir\bin\" -Force
          Copy-Item -Path "easytier-ffi\easytier_ffi.lib" "$targetDir\lib\easytier_ffi.lib" -Force
          Copy-Item -Path "${{ github.workspace }}\thirdparty\easytier\include\easytier.h" "$targetDir\include\easytier.h" -Force

      # ---------- libssh ----------
      - name: Download and deploy libssh
        shell: pwsh
        run: |
          $url = "https://github.com/ShiftMediaProject/libssh/releases/download/libssh-0.11.1/libssh_libssh-0.11.1_msvc17.zip"
          Invoke-WebRequest -Uri $url -OutFile libssh.zip
          Expand-Archive -Path libssh.zip -DestinationPath libssh-extract
          $targetDir = "${{ github.workspace }}/../libssh"
          New-Item -ItemType Directory -Force -Path "$targetDir/include/libssh"
          New-Item -ItemType Directory -Force -Path "$targetDir/lib"
          New-Item -ItemType Directory -Force -Path "$targetDir/bin"
          Copy-Item -Path "libssh-extract\include\libssh\*.h" -Destination "$targetDir\include\libssh\" -Force
          Copy-Item -Path "libssh-extract\lib\x64\ssh.lib" -Destination "$targetDir\lib\" -Force
          Copy-Item -Path "libssh-extract\lib\x64\libssh.lib" -Destination "$targetDir\lib\" -Force
          Copy-Item -Path "libssh-extract\bin\x64\ssh.dll" -Destination "$targetDir\bin\" -Force

      # ---------- qtermwidget ----------
      - name: Checkout qtermwidget source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 2.4.0 https://github.com/lxqt/qtermwidget.git "${{ github.workspace }}/../qtermwidget-2.4.0"

      # ---------- usbmmidd (virtual display driver) ----------
      - name: Download usbmmidd virtual display driver
        shell: pwsh
        run: |
          $url = "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip"
          Invoke-WebRequest -Uri $url -OutFile usbmmidd_v2.zip
          Expand-Archive -Path usbmmidd_v2.zip -DestinationPath usbmmidd-extract -Force
          $srcDir = Join-Path "usbmmidd-extract" "usbmmidd_v2"
          if (-not (Test-Path $srcDir)) { $srcDir = "usbmmidd-extract" }
          $targetDir = "${{ github.workspace }}/../usbmmidd_v2"
          New-Item -ItemType Directory -Force -Path "$targetDir/x64" | Out-Null
          Copy-Item -Path "$srcDir/deviceinstaller*.exe" -Destination $targetDir -Force
          Copy-Item -Path "$srcDir/usbmmidd.cat" -Destination $targetDir -Force
          Copy-Item -Path "$srcDir/usbmmIdd.inf" -Destination $targetDir -Force
          Copy-Item -Path "$srcDir/x64/usbmmIdd.dll" -Destination "$targetDir/x64/" -Force
          Get-ChildItem -Recurse $targetDir

      # ---------- ConPTY ----------
      - name: Download ConPTY
        shell: pwsh
        run: |
          $conptyDir = "${{ github.workspace }}/../Microsoft.Windows.Console.ConPTY"
          $url = "https://github.com/microsoft/terminal/releases/download/v1.24.11321.0/Microsoft.Windows.Console.ConPTY.1.24.260512001.nupkg"
          Invoke-WebRequest -Uri $url -OutFile conpty.nupkg
          Expand-Archive -Path conpty.nupkg -DestinationPath $conptyDir -Force
          Write-Host "ConPTY deployed to $conptyDir"

      # ---------- CMake 配置 ----------
      - name: Configure CMake
        shell: pwsh
        run: |
          # Do not hardcode the generator: `windows-latest` switched to Visual
          # Studio 2026 (VS 18) in June 2026 and the old "Visual Studio 17 2022"
          # failed with "could not find any instance of Visual Studio".
          # Match the installed Visual Studio against the generators this CMake
          # supports (CMake < 4.2 has no VS 18 generator).
          $known = @(cmake --help |
            Select-String -Pattern 'Visual Studio \d+ \d{4}' |
            ForEach-Object { [regex]::Match($_.Line, 'Visual Studio \d+ \d{4}').Value })
          Write-Host "CMake knows these VS generators: $($known -join ', ')"
          if ($known.Count -eq 0) { Write-Error "This CMake reports no Visual Studio generator"; exit 1 }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere.exe not found"; exit 1 }
          $ver = (& $vswhere -latest -products * -property installationVersion | Select-Object -First 1)
          if (-not $ver) { Write-Error "No Visual Studio installation found"; exit 1 }
          $major = $ver.Split('.')[0]
          $year = @{ '18' = '2026'; '17' = '2022'; '16' = '2019' }[$major]
          $installed = if ($year) { "Visual Studio $major $year" } else { "Visual Studio $major" }
          Write-Host "Installed Visual Studio: $installed (version $ver)"

          if ($known -notcontains $installed) {
            # Older CMake without the VS 18 generator: use the newest VS
            # generator it does support rather than failing.
            $fallback = $known[$known.Count - 1]
            Write-Warning "CMake has no generator for '$installed'; falling back to '$fallback'"
            $installed = $fallback
          }

          if (-not $env:QT_ROOT_DIR) { Write-Error "QT_ROOT_DIR is not set"; exit 1 }
          Write-Host "Using Qt: $env:QT_ROOT_DIR"
          cmake -B build -G "$installed" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      # ---------- 编译 ----------
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 8

      # ---------- 打包整个 Release 目录（包含 exe + DLL + platforms 文件夹）----------
      - name: Package Release folder
        shell: pwsh
        run: |
          # Locate the output folder instead of assuming build/Release, so this
          # also works if the generator ever changes (e.g. Ninja -> build/).
          $exe = Get-ChildItem -Path build -Recurse -Filter "RemoteControl.exe" |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "RemoteControl.exe not found under build/"
            Get-ChildItem -Recurse build | Select-Object FullName
            exit 1
          }
          $releaseDir = Split-Path -Parent $exe.FullName
          Write-Host "Packaging: $releaseDir"
          Get-ChildItem -Recurse $releaseDir
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "${{ github.workspace }}\RemoteControl-Windows.zip"

      # ---------- 上传 artifact ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-Windows
          path: RemoteControl-Windows.zip
          retention-days: 30

      # ---------- 可选：创建 Release ----------
      - name: Create Release
        if: ${{ github.event.inputs.create_release == 'true' && github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: RemoteControl-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
